name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel runs en progreso cuando llega un push nuevo al mismo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  verify:
    name: Lint + Unit + Build + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright system deps
        # --with-deps installs OS packages (libnss3, etc.) needed on Ubuntu.
        # No-op si ya está en caché. El proyecto usa `pnpm e2e:install` (sin --with-deps)
        # que solo descarga el browser. CI necesita deps del sistema, así que usamos
        # playwright install directamente aquí.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Unit tests + coverage
        run: pnpm test:coverage

      - name: Build (smoke test)
        # Verifica que la app compila para producción. E2e corre con dev server,
        # así que este paso es independiente y atrapa errores de build temprano.
        run: pnpm build

      - name: E2E tests
        # playwright.config.ts ya configura retries=2, workers=1 y webServer en CI.
        run: pnpm e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
