<form (submit)="onSubmit($event)" class="login-form">
  <h2>{{ mode() === 'signin' ? 'Iniciar sesión' : 'Crear cuenta' }}</h2>

  @if (mode() === 'signup') {
    <label>
      Nombre
      <input
        type="text"
        name="name"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        autocomplete="name"
      />
    </label>
  }

  <label>
    Email
    <input
      type="email"
      name="email"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      required
      autocomplete="email"
      autofocus
    />
  </label>

  <label>
    Contraseña
    <input
      type="password"
      name="password"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      required
      autocomplete="current-password"
      minlength="6"
    />
  </label>

  @if (error(); as err) {
    <p class="error">{{ err }}</p>
  }

  <div class="actions">
    <button type="submit" [disabled]="submitting()">
      {{ mode() === 'signin' ? 'Entrar' : 'Registrarme' }}
    </button>
    <button type="button" (click)="toggleMode()">
      {{ mode() === 'signin' ? 'Crear cuenta' : 'Ya tengo cuenta' }}
    </button>
  </div>
</form>
