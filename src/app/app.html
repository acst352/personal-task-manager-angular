<router-outlet />
<p>
  {{pendingCount()}} tareas pendientes
</p>

@if (tasks().length > 0) {
<ul>
  @for (task of tasks(); track task.id) {
  <app-task-item [task]="task" (toggle)="onToggle($event)" (remove)="onRemove($event)" />
  } @empty {
  <li>No hay tareas todavía.</li>
  }
</ul>
} @else {
<p>Todavía no cargaste ninguna tarea.</p>
}
